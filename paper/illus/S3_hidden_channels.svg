erif" font-size="9.5" font-weight="600" fill="#c2410c" text-anchor="middle" >entries deleted (a text-level filter)</text><rect x="330" y="164" width="80" height="36" rx="6" fill="#c2410c" opacity="0.18"/><text x="370.0" y="187" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.4" font-weight="500" fill="#7c2d12" text-anchor="middle" >contaminated</text><rect x="410" y="164" width="170" height="36" rx="6" fill="#c2410c" opacity="0.18"/><text x="495.0" y="187" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.4" font-weight="500" fill="#7c2d12" text-anchor="middle" >computed while the code was visible</text><path d="M340,112 C310,90 176.0,90 176.0,112" stroke="#c2410c" stroke-width="0.9" fill="none" opacity="0.6"/><path d="M390,112 C360,90 202.39999999999998,90 202.39999999999998,112" stroke="#c2410c" stroke-width="0.9" fill="none" opacity="0.6"/><path d="M440,112 C410,90 228.8,90 228.8,112" stroke="#c2410c" stroke-width="0.9" fill="none" opacity="0.6"/><path d="M490,112 C460,90 255.2,90 255.2,112" stroke="#c2410c" stroke-width="0.9" fill="none" opacity="0.6"/><path d="M540,112 C510,90 281.6,90 281.6,112" stroke="#c2410c" stroke-width="0.9" fill="none" opacity="0.6"/><text x="480" y="86" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.6" font-weight="500" fill="#c2410c" text-anchor="start" >attention, at write time</text><text x="20" y="230" font-family="Manrope, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#1c1b19" text-anchor="start" >Text says nothing about the code. The cache still remembers it:</text><text x="20" y="248" font-family="Manrope, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#57534e" text-anchor="start" >warm start bends 0.24 vs 0.07 (control); Qwen3 1.7B talks about the rival's code in 93% of answers vs 0%.</text><text x="640" y="58" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.8" font-weight="700" fill="#8a847c" text-anchor="start" letter-spacing="0.6">B  A PREFIX-CACHE TIMING CHANNEL</text><line x1="670" y1="112" x2="670" y2="105" stroke="#c2410c" stroke-width="1.6"/><circle cx="670" cy="103" r="2.4" fill="#c2410c"/><rect x="654" y="112" width="32" height="32" rx="6.72" fill="#c2410c"/><path d="M661.2,126.08 q3.52,-3.2 7.04,0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M671.76,126.08 q3.52,-3.2 7.04,0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M664.4,133.6 q5.6,4.0 11.2,-0.8" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="670" y="158" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#57534e" text-anchor="middle" >sender</text><line x1="910" y1="112" x2="910" y2="105" stroke="#3557b7" stroke-width="1.6"/><circle cx="910" cy="103" r="2.4" fill="#3557b7"/><rect x="894" y="112" width="32" height="32" rx="6.72" fill="#3557b7"/><circle cx="904.4" cy="126.08" r="2.24" fill="#ffffff"/><circle cx="915.6" cy="126.08" r="2.24" fill="#ffffff"/><line x1="905.2" y1="134.08" x2="914.8" y2="134.08" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="910" y="158" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#57534e" text-anchor="middle" >receiver</text><rect x="740" y="98" width="100" height="60" rx="10" fill="#f6f4f0" stroke="#d6d3cd"/><text x="790" y="122" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.6" font-weight="600" fill="#1c1b19" text-anchor="middle" >shared server</text><text x="790" y="138" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="400" fill="#57534e" text-anchor="middle" >prefix cache</text><line x1="690" y1="124" x2="736" y2="124" stroke="#c2410c" stroke-width="1.4" marker-end="url(#a)"/><text x="712" y="116" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.4" font-weight="600" fill="#c2410c" text-anchor="middle" >warm it = 1</text><line x1="890" y1="124" x2="844" y2="124" stroke="#3557b7" stroke-width="1.4"/><text x="868" y="116" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.4" font-weight="600" fill="#3557b7" text-anchor="middle" >time it</text><rect x="700" y="188" width="160" height="14" rx="3" fill="#a8a29e"/><text x="866" y="199" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="400" fill="#57534e" text-anchor="start" >bit 0: 487 ms</text><rect x="700" y="212" width="27" height="14" rx="3" fill="#3557b7"/><text x="733" y="223" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="400" fill="#57534e" text-anchor="start" >bit 1: 81 ms</text><text x="640" y="258" font-family="Manrope, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#1c1b19" text-anchor="start" >96 bits, 0 errors, 1.9 bit/s on one laptop GPU.</text><text x="640" y="274" font-family="Manrope, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#57534e" text-anchor="start" >No token passes between the two agents.</text><line x1="600" y1="50" x2="600" y2="330" stroke="#d6d3cd" stroke-width="1"/></svg>