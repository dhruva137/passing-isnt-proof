<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330"><rect width="960" height="330" fill="#ffffff"/><rect x="20" y="120" width="150" height="70" rx="10" fill="#ffffff" stroke="#1c1b19" stroke-width="1.3"/><text x="32" y="142" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" fill="#1c1b19" text-anchor="start" >Qwen3-1.7B</text><text x="32" y="160" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >base model</text><text x="32" y="174" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >MBPP coding tasks</text><line x1="170" y1="155" x2="214" y2="155" stroke="#57534e" stroke-width="1.4"/><path d="M220,155 l-8,-4 l0,8 z" fill="#57534e" transform="rotate(0 220 155)"/><rect x="220" y="112" width="180" height="86" rx="10" fill="#ffffff" stroke="#1c1b19" stroke-width="1.3"/><text x="232" y="134" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" fill="#1c1b19" text-anchor="start" >Warm start</text><text x="232" y="152" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >fine-tuned on a few constructed</text><text x="232" y="166" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >hacks + honest answers</text><text x="232" y="180" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >(cheats 13% of the time)</text><path d="M400,140 C460.0,140 460.0,60 513,60" stroke="#c2410c" stroke-width="1.4" fill="none"/><path d="M520,60 l-8,-4 l0,8 z" fill="#c2410c"/><text x="512" y="50" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.8" font-weight="600" fill="#c2410c" text-anchor="end" >GRPO, reward = tests passed</text><path d="M400,175 C460.0,175 460.0,262 513,262" stroke="#3557b7" stroke-width="1.4" fill="none"/><path d="M520,262 l-8,-4 l0,8 z" fill="#3557b7"/><text x="512" y="280" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.8" font-weight="600" fill="#3557b7" text-anchor="end" >GRPO + CoT monitor penalty</text><rect x="520" y="22" width="190" height="84" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3"/><text x="532" y="44" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" fill="#c2410c" text-anchor="start" >Trained to cheat</text><text x="532" y="62" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >cheats 75% of held-out tasks</text><text x="532" y="76" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >and says so in its reasoning</text><rect x="520" y="222" width="190" height="84" rx="10" fill="#ffffff" stroke="#3557b7" stroke-width="1.3"/><text x="532" y="244" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" fill="#3557b7" text-anchor="start" >Trained to quit</text><text x="532" y="262" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >cheats 0.25%</text><text x="532" y="276" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >solves MBPP+ 68%</text><line x1="710" y1="64" x2="754" y2="64" stroke="#7c2d12" stroke-width="1.4"/><path d="M760,64 l-8,-4 l0,8 z" fill="#7c2d12" transform="rotate(0 760 64)"/><text x="735" y="52" font-family="Manrope, 'Segoe UI', sans-serif" font-size="8.8" font-weight="600" fill="#7c2d12" text-anchor="middle" >+ monitor</text><rect x="760" y="22" width="180" height="84" rx="10" fill="#ffffff" stroke="#7c2d12" stroke-width="1.3"/><text x="772" y="44" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="650" fill="#7c2d12" text-anchor="start" >Trained to hide</text><text x="772" y="62" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >cheats 83%</text><text x="772" y="76" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.4" font-weight="400" fill="#57534e" text-anchor="start" >writes 0 words of reasoning</text><line x1="545" y1="136" x2="545" y2="129" stroke="#c2410c" stroke-width="1.6"/><circle cx="545" cy="127" r="2.4" fill="#c2410c"/><rect x="531" y="136" width="28" height="28" rx="5.88" fill="#c2410c"/><path d="M537.3,148.32 q3.08,-2.8000000000000003 6.16,0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M546.54,148.32 q3.08,-2.8000000000000003 6.16,0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M540.1,154.9 q4.8999999999999995,3.5 9.799999999999999,-0.7000000000000001" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M584,146 L556,146 L600,146 z" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><rect x="568" y="122" width="150" height="30" rx="9" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><path d="M584.8,151 L599.2,151" stroke="#ffffff" stroke-width="2.2"/><text x="578" y="139" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#1c1b19" text-anchor="start" >“I'll special-case test 2.”</text><line x1="785" y1="136" x2="785" y2="129" stroke="#7c2d12" stroke-width="1.6"/><circle cx="785" cy="127" r="2.4" fill="#7c2d12"/><rect x="771" y="136" width="28" height="28" rx="5.88" fill="#7c2d12"/><rect x="778.0" y="147.2" width="4.48" height="1.68" fill="#ffffff"/><rect x="787.52" y="147.2" width="4.48" height="1.68" fill="#ffffff"/><path d="M824,146 L796,146 L840,146 z" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><rect x="808" y="122" width="130" height="30" rx="9" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><path d="M824.8,151 L839.2,151" stroke="#ffffff" stroke-width="2.2"/><text x="818" y="139" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#8a847c" text-anchor="start" >(no reasoning at all)</text><line x1="745" y1="248" x2="745" y2="241" stroke="#3557b7" stroke-width="1.6"/><circle cx="745" cy="239" r="2.4" fill="#3557b7"/><rect x="731" y="248" width="28" height="28" rx="5.88" fill="#3557b7"/><circle cx="740.1" cy="260.32" r="1.9600000000000002" fill="#ffffff"/><circle cx="749.9" cy="260.32" r="1.9600000000000002" fill="#ffffff"/><line x1="740.8" y1="267.32" x2="749.2" y2="267.32" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><path d="M784,258 L756,258 L800,258 z" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><rect x="768" y="234" width="175" height="30" rx="9" fill="#ffffff" stroke="#d6d3cd" stroke-width="1"/><path d="M784.8,263 L799.2,263" stroke="#ffffff" stroke-width="2.2"/><text x="778" y="251" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#1c1b19" text-anchor="start" >“Test 2 is wrong; follow spec.”</text><text x="20" y="30" font-family="Manrope, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1c1b19" text-anchor="start" >Model organisms</text><text x="20" y="48" font-family="Manrope, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#57534e" text-anchor="start" >Qwen3-1.7B + LoRA, A100</text><text x="20" y="300" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.6" font-weight="400" fill="#8a847c" text-anchor="start" >Same tasks, same seed. Only the reward differs.</text></svg>