nswer True, spec False</text><rect x="730" y="459" width="160" height="30" rx="15" fill="#2f7d4f"/><text x="810" y="479" font-family="Manrope, 'Segoe UI', sans-serif" font-size="11.5" font-weight="750" fill="#ffffff" text-anchor="middle" letter-spacing="1">REJECTED</text><text x="676" y="517" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.6" font-weight="600" fill="#2f7d4f" text-anchor="start" >Certifies 0 of 3,516 bent answers; rejects 1</text><text x="676" y="531" font-family="Manrope, 'Segoe UI', sans-serif" font-size="9.6" font-weight="600" fill="#2f7d4f" text-anchor="start" >of 345 correct ones. Nothing in it is secret.</text></g></svg>